name: Build GL.iNet MT6000 AWG 3.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OPENWRT_BRANCH: openwrt-24.10
      OPENWRT_COMMIT: bb59922007043c0a0813d62b0d9f6e801caff9df
      GL_VERMAGIC: 9469a6c8c449c47e503c05678ea1559d

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ env.OPENWRT_BRANCH }}
          path: owrt
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl python3-pyelftools

      - name: Prepare OpenWrt tree
        run: |
          set -eux

          cd owrt
          git reset --hard "${OPENWRT_COMMIT}"

          mkdir -p /tmp/glcfg
          unzip -q ../src/config_mt6000_op24-4.8.3.zip -d /tmp/glcfg

          CFG="$(find /tmp/glcfg -type f | head -n1)"

          if [ -z "$CFG" ]; then
            echo "GL.iNet config not found"
            exit 1
          fi

          cp "$CFG" .config

          cp -r ../src/kmod-amneziawg package/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config

          make defconfig

      - name: Override GL.iNet vermagic
        run: |
          cd owrt

          sed -i \
            's/grep '\''=\[ym\]'\'' $(LINUX_DIR)\/\.config\.set | LC_ALL=C sort | $(MKHASH) md5 > $(LINUX_DIR)\/\.vermagic.*/echo "${{ env.GL_VERMAGIC }}" > $(LINUX_DIR)\/\.vermagic/' \
            include/kernel-defaults.mk

      - name: Build kernel environment
        run: |
          cd owrt

          make tools/install
          make toolchain/install

          make target/linux/clean
          make target/linux/compile -j$(nproc) V=s

          echo "Built vermagic:"
          cat build_dir/target-*/linux-*/linux-*/.vermagic

          VM="$(cat build_dir/target-*/linux-*/linux-*/.vermagic)"

          if [ "$VM" != "${GL_VERMAGIC}" ]; then
            echo "Wrong vermagic: $VM"
            exit 1
          fi

      - name: Build AmneziaWG 3.1 kmod
        run: |
          cd owrt

          make package/kmod-amneziawg/clean V=s
          make package/kmod-amneziawg/download V=s
          make package/kmod-amneziawg/prepare V=s
          make package/kmod-amneziawg/compile -j$(nproc) V=s

          echo "Built package:"
          find bin/ -name 'kmod-amneziawg*.ipk' -print

      - name: Collect result
        run: |
          mkdir -p output

          find owrt/bin/ \
            -name 'kmod-amneziawg*.ipk' \
            -exec cp {} output/ \;

          ls -lh output/

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: glinet-mt6000-awg31-kmod
          path: output/*.ipk
