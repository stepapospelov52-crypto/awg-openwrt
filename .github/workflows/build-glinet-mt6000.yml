name: Build GL.iNet MT6000 AWG 3.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GL_VERMAGIC: 9469a6c8c449c47e503c05678ea1559d

    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout OpenWrt 24.10.4
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: v24.10.4
          path: owrt
          fetch-depth: 0

      - name: Checkout MediaTek patches
        uses: actions/checkout@v4
        with:
          repository: gl-inet/mtk-openwrt-feeds
          path: mtk
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev \
            libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl python3-pyelftools

      - name: Apply MediaTek 24.10 files and patches
        run: |
          set -eux

          cp -af mtk/24.10/files/* owrt/

          cd owrt

          for p in $(find ../mtk/24.10/patches-base -name "*.patch" | sort); do
            echo "Applying $p"
            patch -p1 < "$p"
          done

      - name: Apply GL.iNet MT6000 config
        run: |
          set -eux

          mkdir -p /tmp/glcfg
          unzip -q src/config_mt6000_op24-4.8.3.zip -d /tmp/glcfg

          echo "Config files:"
          find /tmp/glcfg -type f -print

          CFG="$(find /tmp/glcfg -type f | head -n1)"

          if [ -z "$CFG" ]; then
            echo "GL.iNet config not found"
            exit 1
          fi

          cp "$CFG" owrt/.config
          cp -r src/kmod-amneziawg owrt/package/

          cd owrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config

          make defconfig

      - name: Build kernel 6.6.110 environment
        run: |
          set -eux
          cd owrt

          make tools/install -j2
          make toolchain/install -j2

          make target/linux/clean
          make target/linux/compile -j2 V=s

          echo "Checking kernel version..."

          if ! find build_dir -type d -name 'linux-6.6.110' | grep -q .; then
            echo "ERROR: kernel 6.6.110 was NOT built"
            find build_dir -type d -name 'linux-6.6.*' -print
            exit 1
          fi

          echo "Kernel 6.6.110 confirmed"

      - name: Set GL.iNet package vermagic
        run: |
          set -eux
          cd owrt

          VMFILE="$(find build_dir -name .vermagic | head -n1)"

          if [ -z "$VMFILE" ]; then
            echo ".vermagic file not found"
            exit 1
          fi

          echo "${GL_VERMAGIC}" > "$VMFILE"

          echo "Package vermagic:"
          cat "$VMFILE"

          if [ "$(cat "$VMFILE")" != "${GL_VERMAGIC}" ]; then
            echo "Wrong vermagic"
            exit 1
          fi

      - name: Build AmneziaWG 3.1 kmod
        run: |
          set -eux
          cd owrt

          make package/kmod-amneziawg/clean V=s
          make package/kmod-amneziawg/download V=s
          make package/kmod-amneziawg/prepare V=s
          make package/kmod-amneziawg/compile -j2 V=s

          echo "Built package:"
          find bin/ -name 'kmod-amneziawg*.ipk' -print

      - name: Collect result
        run: |
          mkdir -p output

          find owrt/bin/ \
            -name 'kmod-amneziawg*.ipk' \
            -exec cp {} output/ \;

          ls -lh output/

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: glinet-mt6000-awg31-kmod-6.6.110
          path: output/*.ipk
